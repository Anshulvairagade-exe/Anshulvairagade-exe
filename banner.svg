<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .prompt { fill:#39ff88; }
    .cmd { fill:#e6edf3; }
    .out { fill:#8b949e; }
    .accent { fill:#39ff88; }
    .warn { fill:#ffb454; }
    .line { animation: show 0.35s ease-out backwards; }
    .l1 { animation-delay: 0.4s; }
    .l2 { animation-delay: 1.4s; }
    .l3 { animation-delay: 2.0s; }
    .l4 { animation-delay: 2.6s; }
    .l5 { animation-delay: 3.4s; }
    .l6 { animation-delay: 4.0s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .scan { animation: scan 4s linear infinite; }
    @keyframes show { from { opacity:0; } to { opacity:1; } }
    @keyframes blink { 50% { opacity:0; } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(300px); } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1a12"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff88" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="win"><rect x="0" y="0" width="900" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect width="900" height="300" fill="url(#grid)"/>
    <rect class="scan" width="900" height="40" fill="url(#beam)"/>

    <!-- title bar -->
    <rect width="900" height="34" fill="#161b22"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="17" r="6" fill="#febc2e"/>
    <circle cx="62" cy="17" r="6" fill="#28c840"/>
    <text x="450" y="22" text-anchor="middle" class="mono out" font-size="13">anshul@kali: ~/security</text>

    <!-- terminal lines -->
    <g class="mono" font-size="17">
      <text x="28" y="72" class="line l1"><tspan class="prompt">(anshul@kali)-[~]</tspan></text>
      <text x="28" y="98" class="line l1"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text>

      <text x="28" y="140" class="line l2 accent" font-size="34" font-weight="700">Anshul Vairagade</text>

      <text x="28" y="172" class="line l3"><tspan class="out">[+] role     : </tspan><tspan class="cmd">Cybersecurity Student</tspan></text>
      <text x="28" y="198" class="line l4"><tspan class="out">[+] focus    : </tspan><tspan class="cmd">Pentesting · Digital Forensics · AI Security</tspan></text>
      <text x="28" y="224" class="line l5"><tspan class="out">[+] building : </tspan><tspan class="cmd">offensive &amp; defensive security tooling</tspan></text>
      <text x="28" y="260" class="line l6"><tspan class="prompt">$ </tspan><tspan class="warn">./break_things_to_secure_them.sh</tspan><tspan class="accent cursor" font-weight="700"> _</tspan></text>
    </g>

    <!-- shield emblem -->
    <g transform="translate(760,150)" class="line l2" opacity="0.9">
      <path d="M0 -70 L58 -48 L58 6 C58 44 30 66 0 78 C-30 66 -58 44 -58 6 L-58 -48 Z"
            fill="none" stroke="#39ff88" stroke-width="2.5"/>
      <path d="M0 -54 L44 -37 L44 4 C44 34 22 52 0 62 C-22 52 -44 34 -44 4 L-44 -37 Z"
            fill="#39ff88" fill-opacity="0.07" stroke="#39ff88" stroke-opacity="0.35"/>
      <rect x="-16" y="-6" width="32" height="26" rx="4" fill="none" stroke="#39ff88" stroke-width="2.5"/>
      <path d="M-9 -6 V-16 A9 9 0 0 1 9 -16 V-6" fill="none" stroke="#39ff88" stroke-width="2.5"/>
      <circle cx="0" cy="7" r="3.5" fill="#39ff88"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="none" stroke="#30363d"/>
</svg>
